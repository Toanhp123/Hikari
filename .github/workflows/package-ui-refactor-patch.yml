name: Package UI refactor patch

on:
  push:
    branches:
      - artifact/ui-state-performance-refactor-patch

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Upload patch
        uses: actions/upload-artifact@v4
        with:
          name: hikari-ui-state-performance-refactor
          path: hikari-ui-state-performance-refactor.patch
          if-no-files-found: error
