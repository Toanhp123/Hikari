name: Sequential full test diagnosis

on:
  push:
    branches:
      - verify/full-test-sequential

permissions:
  contents: read

jobs:
  sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run sequential full test
        run: timeout 420s flutter test --concurrency=1 -r expanded
