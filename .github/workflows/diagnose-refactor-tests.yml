name: Diagnose refactor tests

on:
  push:
    branches:
      - verify/ui-state-performance-refactor

permissions:
  contents: read

jobs:
  targeted:
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/home_page_test.dart
          - test/library_page_test.dart
          - test/media_kit_video_session_test.dart
          - test/unified_search_page_test.dart
          - test/unified_search_view_model_test.dart
          - test/readers_test.dart
          - test/reader_progress_test.dart
          - test/epub_reader_test.dart
          - test/publication_reader_test.dart
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run targeted test
        run: flutter test "${{ matrix.file }}" -r expanded
