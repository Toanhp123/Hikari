name: Split library tests

on:
  push:
    branches:
      - verify/library-test-split

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name:
          - "library empty state and persisted snapshots open without scan then remove"
          - "scan refreshes membership after returning from Library"
          - "scan result toggles persisted library membership"
          - "reactive repository updates an already mounted LibraryPage"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run library test
        run: flutter test test/library_page_test.dart --plain-name "${{ matrix.name }}" -r expanded
