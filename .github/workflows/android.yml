name: Android CI

on:
  push:
    branches:
      - master
      - main
      - "wave-*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make scripts executable
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Verify repository
        run: ./scripts/verify.sh

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports
            build/reports/detekt
            build-logic/build/reports
            core/common/build/reports
            core/database/build/reports
            core/model/build/reports
            core/network/build/reports
            core/plugin-api/build/reports
            core/plugin-host/build/reports
            test/fixtures/build/reports

  instrumentation-api-26:
    name: Instrumentation API 26
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make scripts executable
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Run API 26 instrumentation and launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./scripts/instrumentation/android.sh 26

      - name: Upload API 26 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-api-26-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/apk

  instrumentation-api-37:
    name: Instrumentation API 37
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make scripts executable
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Run API 37 instrumentation and launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./scripts/instrumentation/android.sh 37

      - name: Upload API 37 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-api-37-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/apk

  database-api-26:
    name: Wave 02 Database API 26
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make scripts executable
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Run Wave 02 database instrumentation on API 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./scripts/instrumentation/database.sh 26

      - name: Upload API 26 database reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wave-02-database-api-26-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            core/database/build/reports/androidTests
            core/database/build/outputs/androidTest-results
            core/database/build/outputs/apk

  database-api-37:
    name: Wave 02 Database API 37
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make scripts executable
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Run Wave 02 database instrumentation on API 37
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./scripts/instrumentation/database.sh 37

      - name: Upload API 37 database reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wave-02-database-api-37-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            core/database/build/reports/androidTests
            core/database/build/outputs/androidTest-results
            core/database/build/outputs/apk

  wave-01-checkpoint:
    name: Wave 01 Checkpoint
    if: always()
    needs:
      - verify
      - instrumentation-api-26
      - instrumentation-api-37
    runs-on: ubuntu-latest

    steps:
      - name: Require every Wave 01 gate
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          API_26_RESULT: ${{ needs.instrumentation-api-26.result }}
          API_37_RESULT: ${{ needs.instrumentation-api-37.result }}
        run: |
          printf 'verify=%s\napi26=%s\napi37=%s\n' \
            "$VERIFY_RESULT" "$API_26_RESULT" "$API_37_RESULT"
          test "$VERIFY_RESULT" = "success"
          test "$API_26_RESULT" = "success"
          test "$API_37_RESULT" = "success"

  wave-02-checkpoint:
    name: Wave 02 Checkpoint
    if: always()
    needs:
      - wave-01-checkpoint
      - database-api-26
      - database-api-37
    runs-on: ubuntu-latest

    steps:
      - name: Require every Wave 02 gate
        env:
          WAVE_01_RESULT: ${{ needs.wave-01-checkpoint.result }}
          DATABASE_API_26_RESULT: ${{ needs.database-api-26.result }}
          DATABASE_API_37_RESULT: ${{ needs.database-api-37.result }}
        run: |
          printf 'wave01=%s\ndatabase-api26=%s\ndatabase-api37=%s\n' \
            "$WAVE_01_RESULT" \
            "$DATABASE_API_26_RESULT" \
            "$DATABASE_API_37_RESULT"
          test "$WAVE_01_RESULT" = "success"
          test "$DATABASE_API_26_RESULT" = "success"
          test "$DATABASE_API_37_RESULT" = "success"

  wave-03-checkpoint:
    name: Wave 03 Contract Checkpoint
    needs:
      - wave-02-checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make scripts executable
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Verify Wave 03 plugin contracts
        run: ./scripts/checkpoints/plugin-contracts.sh

      - name: Upload Wave 03 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wave-03-contract-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            core/plugin-api/build/reports
            core/plugin-host/build/reports
            test/fixtures/build/reports
            build/reports/detekt
