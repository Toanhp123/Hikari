name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - name: Materialize official wrapper when bootstrap archive has no wrapper binary
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./scripts/bootstrap-wrapper.sh
          fi
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify host bootstrap gate
        run: ./scripts/verify-bootstrap.sh --host-only

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 37]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - name: Materialize official wrapper when bootstrap archive has no wrapper binary
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./scripts/bootstrap-wrapper.sh
          fi
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
