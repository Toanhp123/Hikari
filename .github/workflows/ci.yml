name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: Install compile SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Materialize official wrapper when bootstrap archive has no wrapper binary
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            bash scripts/bootstrap-wrapper.sh
          fi
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify bootstrap contracts
        run: |
          bash scripts/tests/bootstrap-execution-harness-test.sh
          bash scripts/tests/ci-bootstrap-contract-test.sh
          bash scripts/tests/gradle-bootstrap-contract-test.sh
      - name: Verify host bootstrap gate
        run: bash scripts/verify-bootstrap.sh --host-only

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '23'
            target: default
          - api-level: '37.0'
            target: google_apis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: Install compile SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Materialize official wrapper when bootstrap archive has no wrapper binary
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            bash scripts/bootstrap-wrapper.sh
          fi
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon
