name: Diagnose full-suite shards

on:
  push:
    branches:
      - verify/ui-state-performance-refactor

permissions:
  contents: read

jobs:
  shard:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: shard-1a
            files: >-
              test/app_smoke_test.dart
              test/application_workflow_test.dart
              test/architecture_guard_test.dart
              test/archive_copy_pool_test.dart
              test/components_test.dart
          - id: shard-1b
            files: >-
              test/epub_reader_test.dart
              test/home_page_test.dart
              test/library_page_test.dart
              test/lnreader_runtime_test.dart
              test/local_archive_restart_test.dart
          - id: shard-3a
            files: >-
              test/novel_content_view_test.dart
              test/novel_contract_test.dart
              test/novel_html_test.dart
              test/publication_reader_test.dart
              test/reader_progress_test.dart
          - id: shard-3b
            files: >-
              test/readers_test.dart
              test/reading_metadata_test.dart
              test/remote_manga_test.dart
              test/remote_novel_test.dart
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run shard
        run: flutter test ${{ matrix.files }} -r expanded
